name: Release

# A `v*` tag triggers a real, public release: a GitHub Release plus a
# gh-pages deploy of the Web build. Unity used this exact same pattern
# (last tag: v3.2.0) but is retired and won't be released again, so there's
# no collision risk reusing it here — the next tag, whatever it is, is
# unambiguously this (Godot) build. `workflow_dispatch` runs everything
# EXCEPT those two public-facing steps (see the `release` job below) so this
# can be dry-run freely to sanity-check the builds before ever trusting a
# real tag.
#
# The builds come from ci.yml (the flake's `nix flake check`), so a release
# is built and tested exactly like every push.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

jobs:
  build:
    name: Build
    uses: ./.github/workflows/ci.yml
    # Hands ci.yml the CACHIX_AUTH_TOKEN secret (a called workflow gets none).
    secrets: inherit

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      # TODO (doc/TODO.md): the APK is signed with the debug key. F-Droid
      # (the magamajo repo) takes the APK of each release, so a release
      # meant for it needs the real release key first.
      - name: Zip per-platform builds
        run: |
          set -e
          cd artifacts
          chmod +x linux-build/trampoline.x86_64
          (cd linux-build && zip -r "../trampoline-${{ github.ref_name }}-linux.zip" .)
          (cd windows-build && zip -r "../trampoline-${{ github.ref_name }}-windows.zip" .)
          (cd web-build && zip -r "../trampoline-${{ github.ref_name }}-web.zip" .)
          cp macos-build/trampoline.zip "trampoline-${{ github.ref_name }}-macos.zip"
          cp android-build/trampoline.apk "trampoline-${{ github.ref_name }}-android.apk"

      # Only a real tag push publishes anything publicly visible — a
      # workflow_dispatch test run stops right after the zips above, so its
      # output can be inspected as an ordinary (private) workflow artifact
      # without creating a GitHub Release or touching gh-pages.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/trampoline-*

      - name: Deploy Web build to GitHub Pages
        if: startsWith(github.ref, 'refs/tags/')
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: artifacts/web-build
