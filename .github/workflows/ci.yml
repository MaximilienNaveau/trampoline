name: CI

# Everything is built by the repository's flake, the same commands as
# locally (`nix flake check -L` runs both jobs' checks). Two jobs, as the
# game uses the committed audio and doesn't wait for it to be rendered:
# - audio: renders the music and sound effects from tools/audio/ and
#   checks they are the ones committed in assets/audio/;
# - game: formatting, lint, the unit tests on Linux, and every export
#   (Linux, Windows, macOS, Web, Android), uploaded as workflow
#   artifacts. release.yml calls this workflow and publishes those.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  audio:
    name: audio
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      # Pulls from the baxter cache, and pushes what this job builds to it
      # (only when the CACHIX_AUTH_TOKEN secret is there: not on forks' PRs).
      # The Android SDK is never pushed: it's unfree and Google's licence
      # forbids redistributing it, and the cache is public.
      - name: Use the baxter Cachix cache
        uses: cachix/cachix-action@v17
        with:
          name: baxter
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          pushFilter: '-(androidsdk|androidsdk-tools|android-sdk-[^/]*|androidenv-android-sdk-license)$'

      # Only slow when tools/audio/ changed: otherwise the render comes
      # from the cache.
      - name: Render the audio and compare it with assets/audio/
        run: nix build -L .#checks.x86_64-linux.audio-committed

  game:
    name: game
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      # Pulls from the baxter cache, and pushes what this job builds to it
      # (only when the CACHIX_AUTH_TOKEN secret is there: not on forks' PRs).
      # The Android SDK is never pushed: it's unfree and Google's licence
      # forbids redistributing it, and the cache is public.
      - name: Use the baxter Cachix cache
        uses: cachix/cachix-action@v17
        with:
          name: baxter
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          pushFilter: '-(androidsdk|androidsdk-tools|android-sdk-[^/]*|androidenv-android-sdk-license)$'

      # Every check of the flake but the audio job's.
      - name: Check and build the game
        run: |
          set -e
          checks=$(nix eval --raw .#checks.x86_64-linux --apply \
            'c: builtins.concatStringsSep " " (map (n: ".#checks.x86_64-linux." + n)
              (builtins.attrNames (removeAttrs c [ "audio-committed" ])))')
          nix build -L --keep-going $checks

      # Already built by the check above: these only copy them out of the
      # Nix store (upload-artifact doesn't follow the result symlinks).
      - name: Collect the builds
        run: |
          set -e
          for platform in linux windows macos web android; do
            mkdir -p "build/$platform"
            cp -rL --no-preserve=mode "$(nix build ".#$platform" --no-link --print-out-paths)/." "build/$platform/"
          done
          chmod +x build/linux/trampoline.x86_64

      - name: Upload Linux build
        uses: actions/upload-artifact@v6
        with:
          name: linux-build
          path: build/linux

      - name: Upload Windows build
        uses: actions/upload-artifact@v6
        with:
          name: windows-build
          path: build/windows

      - name: Upload macOS build
        uses: actions/upload-artifact@v6
        with:
          name: macos-build
          path: build/macos

      - name: Upload Web build
        uses: actions/upload-artifact@v6
        with:
          name: web-build
          path: build/web

      # Unsigned (release.yml signs it): to install it by hand, sign it
      # with the debug key first (see `android` in flake.nix).
      - name: Upload Android build
        uses: actions/upload-artifact@v6
        with:
          name: android-build
          path: build/android/trampoline.apk
