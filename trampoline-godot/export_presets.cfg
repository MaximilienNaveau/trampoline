; No Apple Developer account/signing identity available yet (see the plan
; doc's "iOS reality check") — this makes Godot stop right after writing out
; the Xcode project instead of attempting to sign and archive an .ipa, which
; would otherwise fail outright with no identity configured. The release
; workflow zips this project directory directly; opening it in Xcode and
; signing it locally is left to whoever actually ships to a device.
