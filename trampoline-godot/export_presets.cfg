application/bundle_identifier="com.magamajo.trampoline"
application/short_version="0.1.0"
application/version="0.1.0"
; Cross-exported from the same Linux container as the other platforms
; (Godot ships a prebuilt macOS app template, no compilation needed) — which
; has no `codesign` binary at all, so this MUST stay Disabled here rather
; than Ad-Hoc. The result is a genuinely unsigned .app: Gatekeeper will
; require a manual right-click-open (or a local `codesign --sign -`) the
; first time it's launched. Real notarization is out of scope for this pass
; (see the plan doc).
codesign/codesign=0
notarization/notarization=0

