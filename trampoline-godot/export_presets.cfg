; Godot's own export-preset config, normally generated/edited through the
; editor's Project > Export... dialog rather than by hand — authored here
; directly since this repo has no local Android/iOS/macOS toolchain to run
; that dialog against. Only the options this project actually needs to
; override are listed per preset; anything absent falls back to Godot's own
; built-in default for that option (confirmed via godot4's own source — a
; preset's options are the *defaults* overlaid with whatever's present here,
; never an all-or-nothing list), so this stays close to golden output the
; editor itself would produce, not a full field-by-field dump.
;
; Expect the first CI run(s) against this file to surface a wrong field name
; or two — there is no way to smoke-test an Android/iOS/macOS export locally
; here. Iterate via a `workflow_dispatch` run of godot_release.yml before
; ever trusting a real version tag (see that workflow's own header comment).

[preset.0]

name="Linux"
platform="Linux/X11"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/linux/trampoline.x86_64"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
binary_format/architecture="x86_64"
binary_format/embed_pck=false

[preset.1]

name="Android"
platform="Android"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/android/trampoline.apk"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

custom_template/debug=""
custom_template/release=""
; Godot 4 exports only via a Gradle-built APK/AAB (the old prebuilt-template
; path is gone) — this is exactly why the release workflow uses the
; `barichello/godot-ci` Docker image, which bundles the Android SDK/NDK/JDK/
; Gradle this build step needs.
gradle_build/use_gradle_build=true
gradle_build/export_format=0
gradle_build/min_sdk=""
gradle_build/target_sdk=""
; Reused from the Unity build (see ../trampoline's own Android settings) so
; this can eventually replace it as an update to the same install, not a
; separate app.
package/unique_name="com.magamajo.trampoline"
package/name="Trampoline"
package/signed=true
; The Unity build's last shipped versionCode was 3002000 (its own
; MAJOR*1_000_000 + MINOR*1_000 + PATCH scheme). Starting the Godot line at
; 4000000 keeps this reading as an upgrade, not a downgrade, to anyone who
; already has the Unity APK installed — bump by the same formula, offset by
; +4_000_000, for each future Godot release.
version/code=4000000
version/name="0.1.0"
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
; Godot's bundled debug keystore — fine for now (see this file's header
; comment and the plan doc: real release signing is a deliberate later
; step). The release/* keys are kept present-but-empty per
; https://github.com/abarichello/godot-ci/issues/161 (a fresh Godot project
; omits them entirely, which then breaks tools that expect to `sed` a real
; value into them later).
keystore/debug=""
keystore/debug_user=""
keystore/debug_password=""
keystore/release=""
keystore/release_user=""
keystore/release_password=""

