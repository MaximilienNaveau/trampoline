name: trampoline
description: "Un jeu pour faire rebondir les mots"
# Like CMake's PROJECT_VERSION, but Dart bakes the build number into the
# version string after a `+`. build-name (before +) is the semantic version
# used as Android versionName/iOS CFBundleShortVersionString; build-number
# (after +) is a monotonically increasing integer (Android versionCode).
# The Unity app is versioned 3.x, so this Flutter rewrite starts at 4.0.0.
version: 4.0.0+1
# Same purpose as a private PyPI/CMake package: keeps `flutter pub publish`
# from ever pushing this to the public pub.dev registry.
publish_to: 'none'

environment:
  # Caret constraint, same idea as `>=3.12.2, <4.0.0` in a requirements.txt.
  sdk: ^3.12.2

# Like a CMakeLists.txt find_package()/target_link_libraries() list, or a
# requirements.txt: every package this app needs to build and run.
dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Static analysis rules (the Dart equivalent of a clang-tidy/pylint config),
  # enabled via analysis_options.yaml.
  flutter_lints: ^6.0.0

# Flutter-specific settings (as opposed to plain-Dart settings above).
flutter:
  # Bundles the Material Design icon font so `Icons.xxx` glyphs render.
  uses-material-design: true

  # Game assets (tile images, board background, custom fonts, ...) will be
  # declared here later, e.g.:
  #   assets:
  #     - assets/images/tile_a.png
